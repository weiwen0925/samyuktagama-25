<style>
:root{
  --bg:#f7f3ec;--text:#2c2416;--text2:#5a4e3a;--text-muted:#6B5B4B;
  --accent:#8b5e3c;--accentL:#c4956a;--accent-red:#8B2500;

*{box-sizing:border-box;}
html,body{scrollbar-width:none;-ms-overflow-style:none;margin:0;padding:0;}

  padding:14px 6px 12px;border-bottom:1px solid rgba(184,134,11,.25);}

  line-height:1.5;transition:color .25s;margin-bottom:8px;}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .l1{display:block;font-family:"Noto Sans TC",sans-serif;font-size:12px;
  letter-spacing:1.5px;color:var(--gold);opacity:.82;}
.sb-brand .l2{display:block;font-size:14px;font-weight:700;letter-spacing:2px;
  color:var(--goldL);margin-top:2px;}
.sb-quick{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:6px;}
.sb-qbtn{display:block;font-family:"Noto Sans TC",sans-serif;font-size:12px;
  color:var(--goldL);text-decoration:none;border:1px solid rgba(184,134,11,.5);
  border-radius:12px;padding:3px 12px;background:rgba(184,134,11,.12);
  letter-spacing:1px;transition:background .2s;}
.sb-qbtn:hover{background:rgba(184,134,11,.28);}
.sb-nav{display:flex;flex-direction:column;align-items:center;gap:4px;
  width:100%;padding:10px 0 0;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 4px;width:100%;text-decoration:none;color:var(--sbText);
  cursor:pointer;border-radius:8px;transition:background .2s;}
.sb-item:hover{background:rgba(184,134,11,.16);}
.sb-item.active{background:rgba(184,134,11,.28);
  box-shadow:0 0 12px rgba(184,134,11,.35);}
.sb-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;

  font-weight:600;border:1.5px solid var(--gold);color:var(--goldL);}
.sb-item.active .sb-circle{background:var(--gold);color:#1e1a14;}
.sb-label{font-size:12.5px;letter-spacing:.3px;opacity:.86;text-align:center;
  font-family:"Noto Sans TC",sans-serif;line-height:1.3;}

/* tooltip */
#sbTip{position:fixed;z-index:200;max-width:280px;background:rgba(30,26,20,.97);
  color:#f0e6d2;border:1px solid rgba(184,134,11,.5);border-radius:10px;
  padding:12px 16px;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;
  pointer-events:none;transition:opacity .2s;font-family:"Noto Sans TC",sans-serif;}
#sbTip.show{opacity:1;}
#sbTip .tip-name{font-size:15px;font-weight:700;color:var(--goldL);margin-bottom:6px;}
#sbTip .tip-desc{font-size:13px;line-height:1.7;color:#d8cdb6;}

/* main */
.main{margin-left:var(--sbW);}
@media(max-width:900px){.main{margin-left:0;} #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);} #sbToggle{display:flex!important;}}

/* hero */
.site-hero{position:relative;background:var(--headGrad);color:#f4ecd8;
  text-align:center;padding:72px 24px 60px;overflow:hidden;}
.site-hero::before{content:"阿含";position:absolute;font-size:300px;font-weight:900;
  color:rgba(212,168,75,.04);top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;white-space:nowrap;}
.site-hero>*{position:relative;z-index:1;}
.hero-title{font-size:56px;font-weight:900;color:var(--goldL);letter-spacing:4px;margin:0 0 14px;}
.hero-subtitle{font-size:20px;color:#e8dcc0;letter-spacing:2px;margin-bottom:18px;}
.hero-meta{font-size:18px;color:#c9b896;letter-spacing:1px;margin-bottom:8px;}
.hero-range{font-size:17px;color:#b8a888;letter-spacing:1px;

/* preface */
.preface{max-width:880px;margin:42px auto;padding:0 28px;}
.preface-title{font-size:30px;color:var(--accent);text-align:center;margin-bottom:24px;

.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin:0 0 18px;text-align:justify;}

.toc-section{max-width:1100px;margin:48px auto;padding:0 28px;}
.toc-title{font-size:34px;color:var(--accent);text-align:center;font-weight:700;

.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}

.toc-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(91,58,41,.14);}
.toc-num{flex:none;width:48px;height:48px;border-radius:50%;background:var(--gold);

.toc-name{font-size:19.5px;line-height:1.7;font-weight:600;color:var(--accent);}
.toc-card .toc-sub{font-size:14.5px;color:var(--text-muted);margin-top:4px;
  font-family:"Noto Sans TC",sans-serif;}

/* chapter */
.chapter{margin:24px 0;}
.ch-head{background:var(--headGrad);color:#f4ecd8;text-align:center;

  background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto 0;}
.ch-pin{font-family:"Noto Sans TC",sans-serif;font-size:15px;letter-spacing:3px;
  color:var(--goldL);opacity:.9;margin-bottom:10px;}
.ch-name{font-size:34px;font-weight:900;color:#f0e4c8;letter-spacing:2px;}
.ch-sub{font-size:17px;color:#c9b896;margin-top:12px;letter-spacing:1px;
  font-family:"Noto Sans TC",sans-serif;}
.ch-body{max-width:1000px;margin:0 auto;padding:30px 22px 10px;}

/* bridge */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);
  border-left:5px solid var(--gold);border-radius:10px;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:12.5px;
  background:var(--gold);color:#fff;padding:3px 12px;border-radius:12px;
  letter-spacing:2.2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;text-align:justify;}

/* iframe */
.ch-frame{display:block;width:100%;border:0;background:#fffdf7;
  border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 20px rgba(91,58,41,.1);
  margin:0 0 8px;min-height:180px;}
.next-link{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:17px;
  color:var(--accent);text-decoration:none;border:1px solid var(--gold);border-radius:20px;
  padding:8px 22px;margin:8px 0 4px;transition:background .2s;}
.next-link:hover{background:var(--gold);color:#fff;}

/* footer */
.site-footer{background:var(--headGrad);color:#e8dcc0;text-align:center;
  padding:48px 24px;margin-top:40px;}
.ft-title{font-size:24px;color:var(--goldL);font-weight:700;letter-spacing:3px;margin-bottom:16px;}
.site-footer p{font-size:17px;line-height:2;color:#c9b896;letter-spacing:1px;}

/* progress capsule */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;
  background:rgba(30,26,20,.92);color:var(--gold);padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;pointer-events:none;user-select:none;
  backdrop-filter:blur(6px);transition:opacity .45s ease,transform .45s ease;}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:12px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

#sbToggle{display:none;position:fixed;top:14px;left:14px;z-index:130;width:44px;height:44px;

  font-size:20px;align-items:center;justify-content:center;cursor:pointer;}
#backTop{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;
  background:var(--gold);color:#fff;border:0;font-size:20px;cursor:pointer;display:none;
  z-index:120;box-shadow:0 3px 12px rgba(0,0,0,.25);}
#backTop.show{display:flex;align-items:center;justify-content:center;}

/* 群組補充解說膠囊 */
.toc-supp{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:0 0 28px;}
.toc-supp-btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-family:"Noto Sans TC",sans-serif;font-size:15px;font-weight:600;letter-spacing:1px;
  color:#7a5410;background:linear-gradient(135deg,#fbeed4,#f3dca8);
  border:1px solid var(--gold);border-radius:24px;padding:10px 22px;
  box-shadow:0 2px 8px rgba(184,134,11,.18);transition:transform .15s,box-shadow .15s,background .15s;}
.toc-supp-btn:hover{transform:translateY(-2px);background:linear-gradient(135deg,#b8860b,#d4a84b);

/* toc-card 右下角影音膠囊 */
.toc-cell{position:relative;display:flex;}
.toc-cell .toc-card{flex:1;padding-bottom:46px;}
.toc-video{position:absolute;right:16px;bottom:14px;display:inline-flex;align-items:center;gap:5px;

  letter-spacing:1px;color:#1e1a14;background:linear-gradient(135deg,#b8860b,#d4a84b);
  border:1px solid rgba(120,86,8,.5);border-radius:20px;padding:5px 14px;
  box-shadow:0 2px 8px rgba(184,134,11,.35);transition:transform .15s,box-shadow .15s;}

/* 主頁浮動影音鈕（隨閱讀品自動切換）*/
#wyVideoDock{position:fixed;right:20px;bottom:80px;z-index:121;display:none;

#wyVideoDock.show{display:flex;}
.wy-vbtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;

.wy-vbtn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(184,134,11,.55);}
.wy-vbtn-2{background:rgba(30,26,20,.92);color:#d4a84b;border:1px solid rgba(184,134,11,.6);

@media(max-width:600px){
  body{font-size:18px;} .hero-title{font-size:40px;} .ch-name{font-size:26px;}
  .toc-grid{grid-template-columns:1fr;}
  #wyVideoDock{right:12px;bottom:70px;} .wy-vbtn{font-size:12.5px;padding:7px 13px;}

/* wy-cross-nav-css v1 */
/* ── 跨卷導覽（側欄底部）── */
.sb-cross{display:flex;flex-direction:column;align-items:center;gap:8px;
  width:100%;margin:18px 0 4px;padding:18px 4px 6px;position:relative;}
.sb-cross::before{content:"";position:absolute;top:0;left:14%;right:14%;
  height:1px;background:linear-gradient(90deg,
    transparent 0%,rgba(184,134,11,.15) 18%,
    var(--gold,#b8860b) 50%,
    rgba(184,134,11,.15) 82%,transparent 100%);
  box-shadow:0 1px 0 rgba(212,168,75,.18);}
.sb-cross::after{content:"";position:absolute;top:6px;left:38%;right:38%;
  height:1px;background:linear-gradient(90deg,
    transparent,rgba(184,134,11,.55),transparent);}
.sb-x{display:flex;flex-direction:column;align-items:center;gap:3px;
  text-decoration:none;color:var(--sbText,#d4c4a8);padding:4px 4px;width:100%;
  border-radius:7px;transition:all .25s;}
.sb-x:hover{background:rgba(184,134,11,.14);transform:translateY(-1px);}
.sb-x-glyph{width:30px;height:30px;border-radius:50%;

  border:1.2px solid rgba(212,196,168,.55);

.sb-x:hover .sb-x-glyph{border-color:var(--gold,#b8860b);color:#fff;
  background:linear-gradient(135deg,var(--gold,#b8860b),var(--goldL,#d4a84b));
  box-shadow:0 0 10px rgba(184,134,11,.5);}
.sb-x-label{font-family:"Noto Sans TC",sans-serif;font-size:10.5px;
  letter-spacing:1.2px;color:var(--sbText,#d4c4a8);opacity:.78;text-align:center;
  line-height:1.25;}
.sb-x:hover .sb-x-label{color:var(--goldL,#d4a84b);opacity:1;}
.sb-x-hub .sb-x-glyph{background:linear-gradient(135deg,
  rgba(184,134,11,.22),rgba(212,168,75,.18));

<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-samyukta-25-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>

    vols[k0].pins.forEach(function(pin){hits.push([k0,pin]);});
  }else if(ts.length&&!pure){
    Object.keys(vols).forEach(function(k){
      vols[k].pins.forEach(function(pin){if(matchAll(pin.t,ts))hits.push([k,pin]);});
    });
  }
  if(hits.length){
    var M1=EXP.p?XCAP:10,S1=Math.min(hits.length,M1);
    h+='<div class="wys-head">品名 · '+hits.length+' 筆 <span class="wys-hint">直達該品</span></div>';
    for(var r=0;r<S1;r++){var k=hits[r][0],pin=hits[r][1];
      h+=row('','' +esc(label(k))+'・品'+pin.p,baseOf(k)+'#'+vols[k].a+'-'+pin.p,hlAll(pin.t,vm?[]:ts));}
    h+=EXP.p?xnote(hits.length,S1):xmore('p',hits.length,S1);
  }
  if(!vm&&!pure&&ts.length){
    var nds=IDX.nodes||{},perk={},ntot=0;
    var nkeys=Object.keys(nds);
    nkeys.sort(function(a,b){var na=/^\d+$/.test(a)?parseInt(a,10):-1,nb=/^\d+$/.test(b)?parseInt(b,10):-1;return na-nb;});
    nkeys.forEach(function(k){
      for(var bi=0;bi<nds[k].length;bi++){var nd=nds[k][bi];
        if(matchAll(nd.t,ts)){(perk[k]=perk[k]||[]).push(nd);ntot++;}}
    });
    var nh=[],ord=Object.keys(perk),rd=0,added=true,DN=EXP.n?XCAP:60;
    while(nh.length<DN&&added){added=false;
      for(var oi=0;oi<ord.length;oi++){var pa=perk[ord[oi]];
        if(pa.length>rd&&nh.length<DN){nh.push([ord[oi],pa[rd]]);added=true;}}
      rd++;}
    if(nh.length){
      var M2=EXP.n?XCAP:10,S2=Math.min(nh.length,M2);
      h+='<div class="wys-head">原典節點 · '+ntot+' 筆 <span class="wys-hint">直達該節</span></div>';
      for(var r2=0;r2<S2;r2++){var kk=nh[r2][0],nd=nh[r2][1];
        h+=row('wys-tag3',esc(label(kk)),baseOf(kk)+'#'+esc(nd.a),hlAll(nd.t,ts));}
      h+=EXP.n?xnote(ntot,S2):xmore('n',ntot,S2);
    }
    var es2=IDX.essays||[],eh=[];
    for(var c2=0;c2<es2.length;c2++){var it3=es2[c2];
      if(matchAll(it3.t+' '+it3.x,ts))eh.push(it3);}
    if(eh.length){
      var M4=EXP.e?XCAP:8,S4=Math.min(eh.length,M4);
      h+='<div class="wys-head">系列導讀 · '+eh.length+' 篇 <span class="wys-hint">開啟文章</span></div>';
      for(var r4=0;r4<S4;r4++){var it4=eh[r4];
        h+=row('wys-tag4','導讀 '+it4.n,'https://weiwen0925.github.io/essay-'+it4.n+'.html',
          '<span class="wys-tt">'+esc(it4.t.slice(0,30))+'</span><br>'+hlAll(snippet(it4.x,ts),ts));}
      h+=EXP.e?xnote(eh.length,S4):xmore('e',eh.length,S4);
    }
    if(!ZI){h+='<div class="wys-head">總表內容 · 索引載入中…</div>';loadZb();}
    else{
      var zperk={},ztot=0;
      for(var z=0;z<ZI.length;z++){var it=ZI[z];
        if(matchAll(it.title+' '+it.txt,ts)){
          var zk=String(it.k);
          (zperk[zk]=zperk[zk]||[]).push(it);ztot++;}}
      var zh=[],zord=Object.keys(zperk),zrd=0,zadd=true,DZ=EXP.z?XCAP:80;
      zord.sort(function(a,b){var na=/^\d+$/.test(a)?parseInt(a,10):-1,nb=/^\d+$/.test(b)?parseInt(b,10):-1;return na-nb;});
      while(zh.length<DZ&&zadd){zadd=false;
        for(var zo=0;zo<zord.length;zo++){var zpa=zperk[zord[zo]];
          if(zpa.length>zrd&&zh.length<DZ){zh.push(zpa[zrd]);zadd=true;}}
        zrd++;}
      if(zh.length){
        var M3=EXP.z?XCAP:12,S3=Math.min(zh.length,M3);
        h+='<div class="wys-head">總表內容 · '+ztot+' 筆 <span class="wys-hint">達該品(右下有總表鈕)</span></div>';
        for(var r3=0;r3<S3;r3++){var it2=zh[r3];
          var vk=vols[it2.k];
          h+=row('wys-tag2',esc(label(it2.k))+'・品'+it2.p,baseOf(it2.k)+'#'+((vk&&vk.a)||'chapter')+'-'+it2.p,
            '<span class="wys-tt">'+esc(it2.title.slice(0,26))+'</span><br>'+hlAll(snippet(it2.txt,ts),ts));}
        h+=EXP.z?xnote(ztot,S3):xmore('z',ztot,S3);
      }
    }
    /* ⑤ 白話翻譯（各卷「譯」浮動鈕的 原文↔白話↔中觀概念 對照表；search-index.json 鍵 bhv，
         陸續上傳的品重跑部署腳本即自動入索引）——全量收集算真實總數、round-robin 分卷公平 */
    var bhv=IDX.bhv||[];
    if(bhv.length){
      var bperk={},btot=0;
      for(var w=0;w<bhv.length;w++){var bit=bhv[w];
        if(matchAll(bit.t+' '+bit.x,ts)){
          var bk=String(bit.k);
          (bperk[bk]=bperk[bk]||[]).push(bit);btot++;}}
      var bh=[],bord=Object.keys(bperk),brd=0,badd=true,DB=EXP.b?XCAP:80;
      bord.sort(function(a,b){var na=/^\d+$/.test(a)?parseInt(a,10):-1,nb=/^\d+$/.test(b)?parseInt(b,10):-1;return na-nb;});
      while(bh.length<DB&&badd){badd=false;
        for(var bo=0;bo<bord.length;bo++){var bpa=bperk[bord[bo]];
          if(bpa.length>brd&&bh.length<DB){bh.push(bpa[brd]);badd=true;}}
        brd++;}
      if(bh.length){
        var M5=EXP.b?XCAP:8,S5=Math.min(bh.length,M5);
        h+='<div class="wys-head">白話翻譯 · '+btot+' 筆 <span class="wys-hint">開啟白話翻譯表</span></div>';
        for(var r5=0;r5<S5;r5++){var bt2=bh[r5];
          h+=row('wys-tag5',esc(label(String(bt2.k)))+'・品'+bt2.p,baseOf(String(bt2.k))+'#bh-'+bt2.p,
            '<span class="wys-tt">'+esc(bt2.t.slice(0,26))+'</span><br>'+hlAll(snippet(bt2.x,ts),ts));}
        h+=EXP.b?xnote(btot,S5):xmore('b',btot,S5);
      }
    }
    /* ⑥ 疑難注腳（注腳設定單一真源 → search-fn 分片；連結直達該節摺卡） */
    var fnv=IDX.fnv||[];
    if(fnv.length){
      var fhits=[];
      for(var f1=0;f1<fnv.length;f1++){var ft=fnv[f1];
        if(matchAll(ft.t+' '+ft.x,ts))fhits.push(ft);}
      if(fhits.length){
        var MF6=EXP.f?XCAP:6,SF6=Math.min(fhits.length,MF6);
        h+='<div class="wys-head">疑難注腳 · '+fhits.length+' 筆 <span class="wys-hint">跳至該節展開摺卡</span></div>';
        for(var f2=0;f2<SF6;f2++){var fe=fhits[f2];
          h+=row('wys-tag6',esc(label(String(fe.k)))+'・注腳',baseOf(String(fe.k))+'#'+fe.a,
            '<span class="wys-tt">'+esc(fe.t.slice(0,30))+'</span><br>'+hlAll(snippet(fe.x,ts),ts));}
        h+=EXP.f?xnote(fhits.length,SF6):xmore('f',fhits.length,SF6);
      }
    }
  }
  if(!h){
    if(!IDX.vols)h='<div class="wys-head">索引載入失敗 · 請檢查網路後重新整理頁面</div>';
    else h='<div class="wys-head">查無結果 · 換個關鍵詞試試</div>'
         +'<div class="wys-more">多詞以空格分隔時，須「同一品／同一項」同時含有全部詞；可改試單詞或同義詞</div>';
  }
  sres.innerHTML=h;
}

    var r=JSON.parse(localStorage.getItem('wysRecent')||'[]');

  var xm=e.target.closest&&e.target.closest('[data-xmore]');

function smClose(){sm.classList.remove('show');document.documentElement.style.overflow='';}
idoc.addEventListener('keydown',function(e){if(e.key==='Escape')smClose();});
fab.addEventListener('click',function(){sm.classList.add('show');document.documentElement.style.overflow='hidden';
  loadIdx();try{if(!(sin.value||'').trim())renderStarter();}catch(e){}setTimeout(function(){try{sin.focus();}catch(e){}},60);});

function fabPlace(){ /* 避讓左側固定導覽欄(sb-nav 等):排到欄右側 12px */
  var right=0,cands=document.querySelectorAll('[class*="sb"],[class*="side"],[class*="rail"],nav,aside');
  for(var i=0;i<cands.length;i++){var el=cands[i];
    if(el===fab||sm.contains(el))continue;
    var st;try{st=getComputedStyle(el);}catch(_){continue;}
    if(st.position!=='fixed'&&st.position!=='sticky')continue;
    var r=el.getBoundingClientRect();
    if(r.left<48&&r.width>0&&r.width<150&&r.height>200&&r.right>right)right=r.right;
  }
  fab.style.left=(right>0?Math.round(right)+12:24)+'px';
}
function fabShow(){fab.classList.toggle('show',window.scrollY>250);fabPlace();}
setInterval(fabPlace,1500);
window.addEventListener('scroll',fabShow,{passive:true});
setTimeout(fabShow,600);setTimeout(fabShow,2000);

})();
